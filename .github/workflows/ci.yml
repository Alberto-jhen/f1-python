name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend checks ──────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: f1_project/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r ../../requirements.txt

      - name: Check syntax (compile all .py files)
        run: python -m compileall -q .
      
      - name: Verify all imports resolve
        run: |
          python -c "
          from core.schemas import *
          from repositories.standings_repository import standings_repo
          from services.data_sources.local_json import LocalJsonSource
          from services.data_sources.ergast import ErgastSource
          from services.data_sources.openf1 import OpenF1Source
          import services.standings_service
          import services.schedule_service
          import services.drivers_service
          import services.plotting_service
          import services.email_service
          import services.h2h_service
          print('✅ All backend imports OK')
          "

      - name: Validate JSON data files
        run: |
          python -c "
          import json, pathlib
          for f in pathlib.Path('data').glob('*.json'):
              json.loads(f.read_text())
              print(f'  ✅ {f.name} is valid JSON')
          "

      - name: Check Pydantic schemas instantiate
        run: |
          python -c "
          from core.schemas import (
              DriverSeasonStanding, DriverCareerStats, OpenF1Standing,
              GlobalStandingEntry, DriverProfile, DriverInfo,
              H2HResponse, YearSchedule, EventDate,
              ReplayResponse, MessageResponse,
          )
          # Verify each DTO can be instantiated with defaults or minimal data
          DriverSeasonStanding()
          DriverCareerStats()
          OpenF1Standing()
          GlobalStandingEntry(position='1', points='100', wins='5', driver='Test', constructor='Team')
          DriverProfile()
          DriverInfo(label='Test', value='TST', number=1, team='Team')
          H2HResponse(year=2026, driver1='VER', driver2='NOR')
          YearSchedule()
          EventDate(year=2026, event='Test', date='2026-01-01')
          MessageResponse(message='ok')
          print('✅ All Pydantic schemas valid')
          "

  # ─── Frontend checks ─────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: f1_project/frontend/f1-stats

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: f1_project/frontend/f1-stats/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build