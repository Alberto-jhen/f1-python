name: Update Standings

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: f1_project/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Le indicamos la ruta exacta desde la raíz para la caché
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # Ahora sí, instala TODO lo que hay en tu requirements.txt
        run: pip install -r requirements.txt

      - name: Run standings updater
        run: python scripts/update_standings.py

      - name: Commit and push if changed
        run: |
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add f1_project/backend/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update standings data [skip ci]"
            git push
          fi